<body class="bg-[#FAF7F2] text-on-surface font-body-md min-h-screen overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flat no shadows">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-max-width mx-auto">

</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">NotaBridge</h1>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden hover:bg-surface-container-high transition-colors duration-200 active:scale-95 transition-transform cursor-pointer">

</div>
</div>
</header>
<main class="pt-24 pb-32 px-margin-mobile max-w-max-width mx-auto flex flex-col gap-lg">
<!-- Workspace Header -->
<div class="mb-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Workspace</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Convert numbered notation to standard staff.</p>
</div>
<!-- Input Area -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm">
<div class="flex justify-between items-center mb-md">
<h3 class="font-headline-md text-headline-md text-on-surface">Enter Numbered Notation</h3>
<div class="flex gap-sm">
<span class="bg-surface-variant text-on-surface-variant font-caption text-caption px-2 py-1 rounded-sm">Key: C</span>
<span class="bg-surface-variant text-on-surface-variant font-caption text-caption px-2 py-1 rounded-sm">4/4</span>
</div>
</div>
<div class="relative">
<textarea class="w-full h-32 bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 resize-none transition-all" placeholder="e.g. 1 2 3 4 | 5 5 5 - |">1 1 5 5 | 6 6 5 - | 4 4 3 3 | 2 2 1 -</textarea>
<button class="absolute bottom-md right-md text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">backspace</span>
</button>
</div>
<div class="mt-md flex justify-end">
<button class="bg-primary text-on-primary font-label-md text-label-md px-lg py-sm rounded-lg hover:bg-surface-tint transition-colors active:scale-95 flex items-center gap-xs">
<span class="material-symbols-outlined">sync</span>
                    Convert
                </button>
</div>
</section>

<div class="flex flex-col gap-md">
<!-- Numbered Preview -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-md uppercase tracking-wider">Notation Preview</h3>
<div class="flex items-center justify-center p-md bg-surface-bright rounded-lg border border-outline-variant/50 min-h-[80px]">
<p class="font-headline-md text-headline-md tracking-[0.5em] text-[#1F2937]">1 1 5 5 | 6 6 5 -</p>
</div>
</section>
<!-- Staff Preview -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm">
