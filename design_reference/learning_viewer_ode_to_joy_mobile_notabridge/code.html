<body class="antialiased min-h-screen text-on-surface">
<!-- Header -->
<header class="sticky top-0 z-10 bg-surface-container-lowest border-b border-outline-variant px-margin-mobile py-sm flex items-center justify-between shadow-sm shadow-black/5">
<button class="flex items-center text-primary font-label-md text-label-md hover:text-primary-container transition-colors group">
<span aria-hidden="true" class="material-symbols-outlined mr-xs text-[20px] transition-transform group-hover:-translate-x-1">arrow_back</span>
            Back to Library
        </button>
<div class="flex space-x-md">
<button aria-label="Settings" class="text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="px-margin-mobile py-lg max-w-3xl mx-auto space-y-xxl">
<!-- Song Info -->
<section class="text-center space-y-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Ode to Joy</h1>
<p class="font-body-lg text-body-lg text-secondary">Ludwig van Beethoven</p>
<div class="flex justify-center gap-sm mt-md">
<span class="bg-surface-variant text-on-surface-variant px-sm py-xs rounded text-caption font-caption">Key: G Major</span>
<span class="bg-surface-variant text-on-surface-variant px-sm py-xs rounded text-caption font-caption">4/4 Time</span>
</div>
</section>
<!-- Numbered Notation Section -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm shadow-black/5">
<h2 class="font-headline-md text-headline-md mb-md border-b border-surface-variant pb-sm">Numbered Notation</h2>
<div class="notation-block font-display-lg text-display-lg tracking-widest leading-loose flex flex-wrap gap-x-xl gap-y-md justify-center">
<span>3 3 4 5</span>
<span>5 4 3 2</span>
<span>1 1 2 3</span>
<span>3. 2 2 -</span>
</div>
</section>
<!-- Staff Notation Section -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm shadow-black/5">
<h2 class="font-headline-md text-headline-md mb-md border-b border-surface-variant pb-sm">Staff Notation</h2>
<div class="notation-block min-h-[120px] flex items-center justify-center border-y-4 border-double border-on-surface relative py-xl">
<!-- Decorative representation of a staff line, normally this would be an SVG or image rendering of actual sheet music -->
<div class="absolute inset-0 flex flex-col justify-evenly pointer-events-none opacity-20">
<div class="border-t border-on-surface w-full"></div>
<div class="border-t border-on-surface w-full"></div>
<div class="border-t border-on-surface w-full"></div>
<div class="border-t border-on-surface w-full"></div>
<div class="border-t border-on-surface w-full"></div>
</div>
<div class="z-10 flex gap-xl text-4xl items-end pb-sm">
<span aria-hidden="true" class="material-symbols-outlined !text-5xl">music_note</span>
<span aria-hidden="true" class="material-symbols-outlined !text-5xl">music_note</span>
<span aria-hidden="true" class="material-symbols-outlined !text-6xl -translate-y-2">music_note</span>
<span aria-hidden="true" class="material-symbols-outlined !text-6xl -translate-y-4">music_note</span>
</div>
</div>
</section>
<!-- Dynamic Pitch Reference -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm shadow-black/5">
<h2 class="font-headline-md text-headline-md mb-md border-b border-surface-variant pb-sm">Pitch Reference (G Major)</h2>
<div class="grid grid-cols-4 sm:grid-cols-7 gap-sm">
<div class="flex flex-col items-center p-sm bg-surface rounded border border-outline-variant">
<span class="font-headline-md text-headline-md text-primary">1</span>
<span class="font-body-md text-body-md text-secondary">G</span>
</div>
<div class="flex flex-col items-center p-sm bg-surface rounded border border-outline-variant">
<span class="font-headline-md text-headline-md text-primary">2</span>
<span class="font-body-md text-body-md text-secondary">A</span>
</div>
<div class="flex flex-col items-center p-sm bg-surface rounded border border-outline-variant">
<span class="font-headline-md text-headline-md text-primary">3</span>
<span class="font-body-md text-body-md text-secondary">B</span>
</div>
<div class="flex flex-col items-center p-sm bg-surface rounded border border-outline-variant">
<span class="font-headline-md text-headline-md text-primary">4</span>
<span class="font-body-md text-body-md text-secondary">C</span>
</div>
<div class="flex flex-col items-center p-sm bg-surface rounded border border-outline-variant">
<span class="font-headline-md text-headline-md text-primary">5</span>
<span class="font-body-md text-body-md text-secondary">D</span>
</div>
<div class="flex flex-col items-center p-sm bg-surface rounded border border-outline-variant">
<span class="font-headline-md text-headline-md text-primary">6</span>
<span class="font-body-md text-body-md text-secondary">E</span>
</div>
<div class="flex flex-col items-center p-sm bg-surface rounded border border-outline-variant">
<span class="font-headline-md text-headline-md text-primary">7</span>
<span class="font-body-md text-body-md text-secondary">F#</span>
</div>
</div>
</section>
